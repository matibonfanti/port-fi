# Refresh the market-data snapshot every US business day after Treasury publishes the curves,
# run the tests on it, and commit it (which redeploys Pages / Vercel).
name: data
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/update_data.py
      - run: uv run pytest -q
      - name: Commit snapshot if it changed
        run: |
          git config user.name "portfi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || (git commit -m "data: refresh snapshot $(date -u +%F)" && git push)
